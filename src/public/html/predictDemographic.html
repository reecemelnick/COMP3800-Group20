<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <div id="nav-placeholder"></div>

    <form class="container">
        <div class="row">
            <div class="col-sm">
                <h3>Demographic Information</h3>
                <fieldset class="" id="form-group-demographic-info">
                    <div id="field-sex">
                        <legend class="col-form-label col-sm-2 pt-0">
                            <h5>Sex</h5>
                        </legend>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gridSex" id="radioMale" value="male"
                                checked>
                            <label class="form-check-label" for="radioMale">
                                Male
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gridSex" id="radioFemale" value="female">
                            <label class="form-check-label" for="radioFemale">
                                Female
                            </label>
                        </div>
                    </div>
                    <h5>Location</h5>
                    <h5>Birthdate</h5>
                    <h5>Socioeconomic Status</h5>
                    <h5>Time in UAE?</h5>
                </fieldset>
            </div>
        </div>
        </div>
        <div class="row">
            <fieldset id="form-group-lifestyle-health">
            </fieldset>
        </div>
        <div class="row">
            <fieldset id="form-group-booking-preference">
            </fieldset>
        </div>
        <div class="row">
            <fieldset id="form-group-additional">
            </fieldset>
        </div>
        <div class="row">
            <div id="form-submit">
                <!-- <button type="submit" class="btn btn-primary" id="form-calculate">CALCULATE</button> -->
            </div>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="../js/predictDemographic.js"></script>
</body>

</html>
