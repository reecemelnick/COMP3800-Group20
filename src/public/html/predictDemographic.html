<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <div id="nav-placeholder"></div>

    <form class="container">
        <div class="row">
            <div class="col-sm">
                <h3>Demographic Information</h3>
                <fieldset class="" id="form-group-demographic-info">

                    <div class="row" id="form-field-sex">
                        <h5>Sex</h5>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gridSex" id="radioMale" value="male"
                                checked>
                            <label class="form-check-label" for="radioMale">
                                Male
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gridSex" id="radioFemale" value="female">
                            <label class="form-check-label" for="radioFemale">
                                Female
                            </label>
                        </div>
                    </div><br />

                    <div class="row" id="form-field-location">
                        <h5>Location</h5>
                        <div class="col-md-auto">
                            <div class="dropdown">
                                <button class="btn btn-secondary dropdown-toggle" type="button"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    Select City
                                </button>
                                <ul class="dropdown-menu">
                                    <!-- TODO: Hardcoded. Later will make db query to fetch all unique cities and inject as items -->
                                    <li><a class="dropdown-item" href="#">Dubai</a></li>
                                    <li><a class="dropdown-item" href="#">Sharjah</a></li>
                                    <li><a class="dropdown-item" href="#">Fujairah</a></li>
                                    <li><a class="dropdown-item" href="#">Ras Al Khaimah</a></li>
                                    <li><a class="dropdown-item" href="#">Abu Dhabi</a></li>
                                    <li><a class="dropdown-item" href="#">Dubai</a></li>
                                </ul>
                            </div>
                        </div>
                    </div><br />

                    <div class="row" id="form-field-birthdate">
                        <h5>Birthdate</h5>
                        <div class="col-3">
                            <input id="birthdate" class="form-control" type="date" />
                            <span id="birthdateSelected"></span>
                        </div>
                    </div><br />
                    <!-- 
                    <h5>Socioeconomic Status</h5>
                    <h5>Time in UAE?</h5> -->
                </fieldset>
            </div>
        </div>
        </div>
        <div class="row">
            <div class="col-sm">
                <fieldset id="form-group-lifestyle-health">
                </fieldset>
            </div>
        </div>
        <div class="row">
            <div class="col-sm">
                <fieldset id="form-group-booking-preference">
                </fieldset>
            </div>
        </div>
        <div class="row">
            <div class="col-sm">
                <fieldset id="form-group-additional">
                </fieldset>
            </div>
        </div>
        <div class="row">
            <div class="col-sm">
                <div id="form-submit">
                    <!-- <button type="submit" class="btn btn-primary" id="form-calculate">CALCULATE</button> -->
                </div>
            </div>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="../js/predictDemographic.js"></script>
</body>

</html>
