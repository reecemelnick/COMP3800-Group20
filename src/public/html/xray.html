<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Xray</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/upload.css">
    <script src="../js/injectnav.js"></script>
</head>

<body>
    <div id="nav-placeholder"></div>
    <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="d-flex flex-column m-2">
            <div class="mb-3">
                <label for="xrayFile" class="form-label">Upload your xray image</label>
                <div id="file-drop" class="border border-primary rounded p-4 text-center" style="user-select: none;">
                    Drag and drop an image here or click to select
                </div>
                <input type="file" id="xrayFile" name="file" class="d-none" accept=".jpg, .png" />
            </div>
            <button type="button" id='submit-btn' class="btn btn-lg btn-primary" disabled>Upload</button>
            <br/>
            <img src="" id="xray-annotated" alt="X-Ray Image">
        </div>
    </div>
    <div class="overlay d-none" id="loading-overlay">
        <div class="overlay__inner">
            <div class="overlay__content"><span class="spinner"></span></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="../js/xray.js"></script>
</body>

</html>
